# Deploy 24/7 en Render. Subí el repo, creá un "Blueprint" apuntando a este archivo.
# El server + worker de envío + scheduler de rutinas corren todos en el mismo proceso.
services:
  - type: web
    name: aeltra-outbound
    runtime: python
    plan: starter            # el free se duerme por inactividad; starter queda 24/7
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_NAME
        value: Aeltra
      - key: FROM_EMAIL
        sync: false
      - key: PROSPECTS_MOCK
        value: "false"
      - key: APIFY_TOKEN
        sync: false
      - key: DB_PATH
        value: /data/aeltra.db     # persiste en el disco montado
      - key: UNSUB_BASE
        sync: false                # poné acá tu URL pública: https://<app>.onrender.com/api/baja
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
